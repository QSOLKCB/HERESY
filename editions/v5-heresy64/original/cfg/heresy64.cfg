MEMORY {
    ZP:       start = $00F7, size = $0006, file = "";
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $27FF, file = %O, define = yes;
    BSSMEM:   start = $C000, size = $1000, file = "", define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    BASIC:    load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = BSSMEM,   type = bss, define = yes;
}
