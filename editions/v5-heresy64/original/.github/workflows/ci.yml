      - name: Verify immutable v3 card deck
        shell: bash
        run: |
          assert_blob() {
            local expected="$1"
            local path="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Historical blob mismatch: $path"
              echo "expected: $expected"
              echo "actual:   $actual"
              exit 1
            fi
