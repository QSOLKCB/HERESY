name: CI Passed (Parent Still Concerned)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ai1440:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python is old enough to have learned restraint
        run: python3 --version
      - name: Ask zero parameters to govern the enterprise
        run: make check
      - name: Display the immutable parental lecture plan without bothering a model
        run: make parent-lab-dry
      - name: Build the complete production control plane
        run: make build
      - name: Verify the control plane is still one floppy
        run: test "$(wc -c < build/HERESY1440.IMG)" -eq 1474560
      - name: Upload the entire enterprise
        uses: actions/upload-artifact@v4
        with:
          name: HERESY-AI-1440
          path: build/HERESY1440.IMG
