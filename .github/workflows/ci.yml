name: CI Passed (Sanity Failed)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  react-basic-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Test, build and enforce floppy budget
        run: npm run check

  c-rust-c-legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editions/v1-c-in-rust-in-c
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify GCC
        run: gcc --version
      - name: Build and run preserved v1
        run: cargo run -q
      - name: Check generated executable
        run: test -x target/heresy_c/heresy_exe
