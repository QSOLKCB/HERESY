name: Public Relations (Nothing Further to Add)

on:
  push:
    branches:
      - main
    paths:
      - "src/v72/**"
      - "src/v7/heresy360.sh"
      - "tests/test_v72.sh"
      - "docs/PUBLIC-RELATIONS.md"
      - "Makefile"
      - ".github/workflows/public-relations.yml"
  pull_request:
    paths:
      - "src/v72/**"
      - "src/v7/heresy360.sh"
      - "tests/test_v72.sh"
      - "docs/PUBLIC-RELATIONS.md"
      - "Makefile"
      - ".github/workflows/public-relations.yml"

permissions:
  contents: read

jobs:
  statement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the languages public relations was assured were obsolete
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gfortran gnucobol

      - name: Compile the approved talking points and their entire bureaucracy
        run: make build

      - name: Verify the response remains factual enough to be funny
        run: sh tests/test_v72.sh

      - name: Issue the statement without a network dependency
        run: make pr-response
