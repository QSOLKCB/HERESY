name: Public Relations (Nothing Further to Add)

on:
  push:
    branches:
      - main
    paths:
      - "src/v72/**"
      - "tests/test_v72.sh"
      - "docs/PUBLIC-RELATIONS.md"
      - "Makefile"
      - ".github/workflows/public-relations.yml"
  pull_request:
    paths:
      - "src/v72/**"
      - "tests/test_v72.sh"
      - "docs/PUBLIC-RELATIONS.md"
      - "Makefile"
      - ".github/workflows/public-relations.yml"

permissions:
  contents: read

jobs:
  statement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the language public relations was assured was obsolete
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Compile the approved talking points
        run: |
          make build/bin/heresy-pr-response build/share/heresy360/incident.tsv

      - name: Verify the response remains factual enough to be funny
        run: sh tests/test_v72.sh

      - name: Issue the statement without a network dependency
        run: build/bin/heresy-pr-response build/share/heresy360/incident.tsv
